<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMeal - Manager Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2E8B57; text-align: center; margin-bottom: 0;}
        p.subtitle { text-align: center; color: #666; margin-top: 5px; margin-bottom: 30px; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #2E8B57; color: white; padding: 15px; margin-top: 25px; border: none; border-radius: 5px; width: 100%; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #246B43; }
        .result-box { margin-top: 30px; padding: 20px; background: #eef9f0; border-left: 6px solid #2E8B57; border-radius: 5px; display: none; }
        h4 { margin-bottom: 5px; color: #333; }
        pre { white-space: pre-wrap; font-family: monospace; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px; overflow-x: auto; font-size: 13px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>EcoMeal Manager Portal 👨‍🍳</h2>
    <p class="subtitle">Log surplus food to trigger Tier 2 NGO Dispatch</p>

    <form id="dispatchForm">
        <label>Hostel & Gate Access Point</label>
        <input type="text" id="hostel_id" value="Main Campus Hostel, Service Gate 3" required>

        <label>Mess Manager Name</label>
        <input type="text" id="uploaded_by" value="Manager Ramesh Singh" required>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Meal Type</label>
                <select id="meal_type">
                    <option>Dinner</option>
                    <option>Lunch</option>
                    <option>Breakfast</option>
                    <option>Snacks</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>Unclaimed Surplus Portions</label>
                <input type="number" id="portions" value="85" min="1" required>
            </div>
        </div>

        <label>Food Category & Menu Items</label>
        <input type="text" id="menu_items" value="Paneer Butter Masala, Roti, Jeera Rice" required>

        <label>Packaging Status</label>
        <select id="packaging_status">
            <option>Unpackaged (Bulk Steel Containers)</option>
            <option>Pre-packaged (Foil/Boxes)</option>
        </select>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Cook Time</label>
                <input type="time" id="cook_time" required>
            </div>
            <div style="flex: 1;">
                <label>Expiration Timestamp</label>
                <input type="time" id="expiration_timestamp" required>
            </div>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 25px;">
            <button type="button" id="btnFlashClaim" style="background-color: #f39c12;">⚡ Tier 1: Campus Flash Claim</button>
            <button type="submit" id="btnNgo" style="background-color: #e74c3c;">🚨 Tier 2: NGO Dispatch</button>
        </div>
    </form>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
    
    <h3 style="color: #333;">Predictive Portioning (Pre-Meal)</h3>
    <p style="color: #666; font-size: 14px;">Generate kitchen instructions based on student poll responses.</p>
    <button type="button" id="btnPredict" style="background-color: #3498db; margin-top: 10px; padding: 10px;">📊 Generate Kitchen Directive</button>

    <div class="result-box" id="resultBox">
        <h3 style="color:#2E8B57; margin-top: 0;">✅ Dispatch Triggered Successfully!</h3>
        
        <h4>Broadcast Message:</h4>
        <pre id="broadcastPreview"></pre>
    </div>
</div>

<script>
    // Set default times (e.g. 7:30 PM and 11:59 PM)
    document.getElementById('cook_time').value = "19:30";
    document.getElementById('expiration_timestamp').value = "23:59";

    // Predict Button
    document.getElementById("btnPredict").addEventListener("click", async function() {
        const meal_id = "WED-DINNER";
        const response = await fetch(`/kitchen/predict?meal_id=${meal_id}`);
        const data = await response.json();
        
        document.getElementById("resultBox").style.display = "block";
        document.querySelector("#resultBox h3").innerText = "👨‍🍳 Kitchen Directive Generated!";
        document.getElementById("broadcastPreview").innerText = "No broadcast needed. Kitchen staff notified directly.\n\n" + data.instruction;
    });

    // Flash Claim Button
    document.getElementById("btnFlashClaim").addEventListener("click", async function() {
        const payload = getFormPayload();
        const response = await fetch("/flash-claim/dispatch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        
        document.getElementById("resultBox").style.display = "block";
        document.querySelector("#resultBox h3").innerText = "⚡ Tier 1 Flash Claim Triggered!";
        document.getElementById("broadcastPreview").innerText = data.broadcast_preview;
    });

    function getFormPayload() {
        return {
            hostel_id: document.getElementById("hostel_id").value,
            uploaded_by: document.getElementById("uploaded_by").value,
            meal_type: document.getElementById("meal_type").value,
            food_category: "Cooked Meals",
            portions: parseInt(document.getElementById("portions").value),
            packaging_status: document.getElementById("packaging_status").value,
            menu_items: document.getElementById("menu_items").value,
            cook_time: document.getElementById("cook_time").value,
            expiration_timestamp: document.getElementById("expiration_timestamp").value
        };
    }

    document.getElementById("dispatchForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        
        const btn = document.getElementById("btnNgo");
        btn.innerText = "Dispatching...";
        btn.style.backgroundColor = "#ccc";
        
        const payload = getFormPayload();

        try {
            const response = await fetch("/ngo/dispatch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("resultBox").style.display = "block";
                document.querySelector("#resultBox h3").innerText = "✅ Tier 2 NGO Dispatch Triggered!";
                document.getElementById("broadcastPreview").innerText = data.broadcast_preview;
                btn.innerText = "🚨 Trigger Another Dispatch";
                btn.style.backgroundColor = "#2E8B57";
            } else {
                alert("Error: " + JSON.stringify(data));
                btn.innerText = "🚨 Trigger Immediate NGO Dispatch";
                btn.style.backgroundColor = "#2E8B57";
            }
        } catch (e) {
            alert("Network Error: Make sure backend is running");
            btn.innerText = "🚨 Trigger Immediate NGO Dispatch";
            btn.style.backgroundColor = "#2E8B57";
        }
    });
</script>

</body>
</html>
